name: AWS-EC2 Instance CD

# Runs after either build workflow finishes, so the instance always
# pulls whichever image was just pushed.
on:
    workflow_run:
        workflows: ["Node.js CI", "Java CI with Maven"]
        types: [completed]

jobs:
    on-success:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: AWS SSM Send-Command
              env:
                  INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
              run: |
                  # Send the deploy commands to the instance. They run as root in /home/ubuntu.
                  COMMAND_ID=$(aws ssm send-command \
                    --instance-ids "$INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --comment "Re-pull the newest book-portal images and restart the changed containers." \
                    --parameters '{"workingDirectory":["/home/ubuntu"],"commands":["docker compose pull","docker compose up -d","docker image prune -af"]}' \
                    --query "Command.CommandId" --output text)
                  echo "SSM command ID: $COMMAND_ID"

                  # Wait up to 5 minutes for the command to finish.
                  STATUS="Pending"
                  for i in $(seq 1 60); do
                    STATUS=$(aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                      --query "Status" --output text 2>/dev/null || echo "Pending")
                    case "$STATUS" in
                      Pending|InProgress|Delayed) sleep 5 ;;
                      *) break ;;
                    esac
                  done

                  # Show what happened on the instance, then fail the job if it did not succeed.
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                    --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                    --output json || true
                  echo "Final status: $STATUS"
                  [ "$STATUS" = "Success" ]
